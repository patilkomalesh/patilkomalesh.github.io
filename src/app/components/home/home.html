<!-- Hero Section -->
<section class="hero-section">
  <div class="hero-background">
    <img src="https://images.unsplash.com/photo-1519741497674-611481863552?w=1920&h=1080&fit=crop&crop=center" 
         alt="Wedding background" class="hero-image">
    <div class="hero-overlay"></div>
  </div>
  
  <div class="hero-content">
    <h1 class="couple-names-hero">
      <span class="groom-name">Parimey</span>
      <span class="and">&</span>
      <span class="bride-name">Khushali</span>
    </h1>
    
    <p class="wedding-date">December 7th, 2025</p>
    
    <!-- Countdown Timer -->
    <div class="countdown-container">
      <h3>Countdown to Our Special Day</h3>
      <div class="countdown">
        <div class="time-unit">
          <span class="number">{{ daysLeft }}</span>
          <span class="label">Days</span>
        </div>
        <div class="time-unit">
          <span class="number">{{ hoursLeft }}</span>
          <span class="label">Hours</span>
        </div>
        <div class="time-unit">
          <span class="number">{{ minutesLeft }}</span>
          <span class="label">Minutes</span>
        </div>
        <div class="time-unit">
          <span class="number">{{ secondsLeft }}</span>
          <span class="label">Seconds</span>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Welcome Message -->
<section class="welcome-section">
  <div class="container">
    <h2>We're Getting Married!</h2>
    <p class="welcome-text">
    </p>
  </div>
</section>
